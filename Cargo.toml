[package]
name = "silk-suite"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = "0.36.2"
hex = "0.4.3"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"

[profile.dev]
opt-level = 1 # Emulation can't run at speed in dev builds without this